name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [12.x, 14.x, 16.x]

    steps:
      - uses: actions/checkout@v2
      - name: Setup node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: Seal Security Fix
        uses: seal-community/cli-action@latest
        with:
          mode: fix
          fix_mode: remote
          token: ${{ secrets.SEAL_TOKEN2 }}
          target: package.json
      - run: npm test
